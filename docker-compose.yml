services:
  db:
    image: mariadb:10.11
    container_name: wp_bootstrap_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.3-apache
    container_name: wp_bootstrap_app
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      # Depuración: solo desarrollo. Descomentar lineas en caso de ser necesario
      # WORDPRESS_DEBUG: "1"
      # WORDPRESS_CONFIG_EXTRA: |
      #   define('WP_DEBUG_LOG', true);
      #   define('WP_DEBUG_DISPLAY', false);
    volumes:
      # La bandera :z reescribe las etiquetas SELinux para que el contenedor pueda leer los temas
      - ./mi-tema-bootstrap:/var/www/html/wp-content/themes/mi-tema-bootstrap:z
      - ./BarRacuda:/var/www/html/wp-content/themes/BarRacuda:z
    restart: unless-stopped

# Volumen persistente de MariaDB
volumes:
  db_data: